{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Log in{% endblock title %}

{% block content %}
<h2>Log In</h2>
<form action = "{% url 'login' %}" method = 'post'>
    {{ form | crispy }}
    {% csrf_token %}
    <button class = "btn btn-success ns-2 " type = 'submit'>Log in</button>
    <a href = "/accounts/password_reset/"><br>forgot password ? </a>

</form>

{% endblock content %}
